# policy/bandit.yaml
# Тихий режим и чистые агрегаты мы будем обеспечивать ключами запуска и парсером,
# этот конфиг — для единообразия исключений/масок.

# Каталоги, которые не надо сканировать (как внутри твоего репо,
# так и внутри распакованных артефактов, если попадутся):
exclude_dirs:
  - .git
  - .hg
  - .venv
  - venv
  - env
  - build
  - dist
  - site-packages
  - tests
  - docs
  - examples/.cache

# Можно явно отключить шумные правила (по желанию):
# skips:
#   - B101  # assert used
#   - B404  # subprocess module
#   - B603  # subprocess with shell equals true (лучше не отключать, просто пример)
