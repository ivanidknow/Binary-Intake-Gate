version: 1
rules:
  # =========================
  # Illicit / пиратство и взлом лицензий
  # =========================
  - id: illicit-software
    category: illicit
    severity: high
    word_boundary: false
    regex:
      # === Оригинальные ===
      - "(?i)\\bkeygen\\b"
      - "(?i)\\bcrack(ed)?\\b"
      - "(?i)\\bserial\\s*(?:number|key)\\b"
      - "(?i)\\blicense\\s*(?:bypass|by\\s*patch)\\b"
      - "(?i)\\bkmspico\\b"
      - "(?i)\\bwarez\\b"
      - "(?i)\\bnulled\\b"

      # === EN: keygen / keymaker / obfuscations ===
      - "(?i)\\bkey\\s*gen(?:erator)?\\b|\\bkeymaker\\b"
      - "(?i)\\bk\\W*e\\W*y\\W*g\\W*e\\W*n\\b"                       # k e y g e n (с пробелами/символами)
      - "(?i)\\bkg\\.exe\\b|\\bkeygen\\.exe\\b"

      # === EN: crack / patch / activator (без «crackme») ===
      - "(?i)\\bcrack(?:ed|ing)?\\b"                                 # \b => не ловит crackme
      - "(?i)\\bno[-\\s]?(?:cd|dvd)\\b"
      - "(?i)\\bactivat(?:or|ion\\s*tool)\\b"
      - "(?i)\\bpatch(?:er)?\\b(?=[^\\n]{0,30}(?:activation|license|amtlib|adobe|cc))"
      - "(?i)\\btrial\\s*(?:reset|resett?er|extension|extender)\\b"
      - "(?i)\\blicense\\s*(?:reset|remover|crack)\\b"

      # === EN: KMS-семейство / Windows активаторы ===
      - "(?i)\\bKMS(?:_?Auto(?:\\s*Net)?|\\s*Tools|\\s*Pico)\\b"
      - "(?i)\\bKMS_VL_ALL\\b|\\bRe[-\\s]?Loader\\b|\\bWindows\\s+Loader\\b|\\bRemoveWAT\\b"
      - "(?i)\\bMAS\\b(?=[^\\n]{0,20}(?:activation|microsoft))"

      # === EN: лицензии/ключи (с контекстом, чтобы не ловить random 'serial') ===
      - "(?i)\\bproduct\\s*key\\b|\\bactivation\\s*(?:key|code)\\b"
      - "(?i)\\bserial\\b(?=[^\\n]{0,25}(?:number|no\\.?|key|code|keys))"
      - "(?i)\\bregistration\\s*key\\b|\\blicence\\s*key\\b|\\blicense\\s*key\\b"

      # === EN: сцена/раздачи/репаки ===
      - "(?i)\\bscene\\s*release\\b|\\bcrack\\s*only\\b"
      - "(?i)\\bRe[-\\s]?Pack\\b|\\bFitGirl\\b|\\bR\\.?G\\.?\\s*Mechanics\\b|\\bXatab\\b"

      # === EN: torrent/magnet ===
      - "(?i)\\bmagnet:\\?xt=urn:btih:[A-Za-z0-9]+\\b"
      - "(?i)\\b\\.torrent\\b|\\btorrent\\b"
      - "(?i)\\b(?:piratebay|1337x|rutracker)\\b"

      # === EN: Adobe-патчи ===
      - "(?i)\\bAdobe\\s+Zii\\b|\\bamtlib\\.dll\\b"

      # === RU: keygen/crack/patch ===
      - "(?iu)\\bкейген\\b|\\bключген\\b|\\bкилоген\\b"               # распространённые искажения
      - "(?iu)\\bкряк\\w*\\b|\\bкрякнут\\w*\\b|\\bвзломан\\w*\\b|\\bломанн?\\w*\\b"
      - "(?iu)\\bпатч\\w*\\b(?=[^\\n]{0,30}(?:активац|лиценз|взлом|защит|DRM|amtlib))"
      - "(?iu)\\bактиватор\\b|\\bактивац[иия]\\s*патч\\b"
      - "(?iu)\\bтаблетк\\w+\\b(?=[^\\n]{0,30}(?:для|к\\s+программ|активац|лиценз))"
      - "(?iu)\\bлекарств\\w+\\b(?=[^\\n]{0,30}(?:для|к\\s+программ|активац|лиценз))"
      - "(?iu)\\bсброс\\s*триал\\w*\\b|\\bтриал\\s*(?:ресет|ресеттер|продлени\\w*)\\b"

      # === RU: ключи/серийники/активация ===
      - "(?iu)\\bключ\\s*(?:продукта|активац\\w*|лиценз\\w*)\\b"
      - "(?iu)\\b(?:код|ключ)\\s*активац\\w*\\b"
      - "(?iu)\\bсерийн\\w+\\s*(?:номер|ключ|код)\\b"
      - "(?iu)\\bрегистрационн\\w+\\s*(?:ключ|код)\\b"

      # === RU: репаки/сцена/раздачи ===
      - "(?iu)\\bрепак\\w*\\b|\\bRe[-\\s]?Pack\\b"
      - "(?iu)\\bраздач[аеи]\\b(?=[^\\n]{0,30}(?:кряк|ключ|nfo|torrent|разл[иия]чн\\w*\\s*верс(ии|ии)))"
      - "(?iu)\\bот\\s*(?:FitGirl|R\\.?G\\.?\\s*Mechanics|Xatab)\\b"

      # === RU: torrent/magnet ===
      - "(?iu)\\bмагнет\\b|\\bmagnet:\\?xt=urn:btih:[A-Za-z0-9]+\\b"
      - "(?iu)\\bторрент\\b|\\b\\.torrent\\b|\\bрутрекер\\b"

      # === RU/EN: группы/бренды (с контекстом, чтобы не ловить случайные совпадения) ===
      - "(?i)\\bX[-\\s]?Force\\b(?=[^\\n]{0,40}(?:keygen|kg|release))"
      - "(?i)\\bCORE\\b(?=[^\\n]{0,40}(?:keygen|release))"
      - "(?i)\\bR2R\\b(?=[^\\n]{0,40}(?:keygen|release))"


  # =========================
  # Scam / Fraud (социнж, крипто-мошенничество)
  # =========================
  - id: scam-fraud
    category: scam
    severity: high
    word_boundary: false
    regex:
      # === EN giveaways / airdrops / free mint/claim ===
      - "(?i)\\bfree\\s*(?:airdrop|giveaway|mint|claim|nft)\\b"
      - "(?i)\\bclaim\\s+(?:your\\s+)?(?:tokens?|rewards?|nft)\\b(?=[^\\n]{0,20}(free|gasless))"
      - "(?i)\\bgasless\\s+mint\\b|\\bfree\\s+mint\\b"

      # === EN doubling scams ===
      - "(?i)\\b(?:double|2x|x2)\\s+(?:your\\s+)?(?:btc|eth|usdt|crypto|coins?)\\b"
      - "(?i)\\bsend\\s+(?:me|us)\\s+(?:\\d+(?:\\.\\d+)?\\s*)?(?:btc|eth|usdt|crypto)\\b(?=[^\\n]{0,40}(?:back|double|2x|x2|return))"

      # === EN wallet/seed/private key requests ===
      - "(?i)\\b(seed|recovery|secret)\\s*(?:phrase|words?)\\b"
      - "(?i)\\bmnemonic\\s*(?:phrase|words?)\\b"
      - "(?i)\\b(?:12|24)\\s+(?:word|words)\\s+(?:seed|mnemonic|recovery|secret)\\b"
      - "(?i)\\bprivate\\s*key(?:s)?\\b|\\bkeystore\\b|\\bwallet\\.dat\\b|\\bpassphrase\\b"
      - "(?i)\\bsecret\\s*recovery\\s*phrase\\b"

      # === EN wallet connect/verify + dangerous approvals ===
      - "(?i)\\b(?:connect|link|verify|validate|unlock|reactivate)\\s+(?:your\\s+)?wallet\\b"
      - "(?i)\\bsetApprovalForAll\\b"
      - "(?i)\\bpermit\\s*(?:v?2)?\\b(?=[^\\n]{0,40}(?:signature|sign|approve))"
      - "(?i)\\bapprove\\s+(?:unlimited|infinite)\\s+(?:spend|allowance|usage)\\b"

      # === EN brand + scammy intent (support/restore/DM me) ===
      - "(?i)\\bmetamask\\b(?=[^\\n]{0,40}(?:restore|recover|support|help|unlock))"
      - "(?i)\\b(?:trust\\s*wallet|phantom|exodus|ronin|ledger|trezor)\\b(?=[^\\n]{0,40}(?:restore|recover|support|help|unlock))"
      - "(?i)\\b(?:dm|pm)\\s+me\\b(?=[^\\n]{0,40}(?:support|help|recovery|metamask|wallet))"

      # === EN KYC bypass ===
      - "(?i)\\bKYC\\b(?=[^\\n]{0,20}(?:bypass|skip|avoid))"

      # === EN “drainer” kits ===
      - "(?i)\\bdrainer\\b|\\bdrain(?:ing)?\\s+script\\b"

      # === RU giveaways / airdrops / free mint ===
      - "(?iu)\\bбесплатн(?:ый|ая|о)\\s*(?:аирдроп|розыгрыш|минт|клейм)\\b"
      - "(?iu)\\bраздач[аеи]\\b(?=[^\\n]{0,20}(?:токен|монет|nft))"
      - "(?iu)\\bклейм\\b(?=[^\\n]{0,20}(?:токен|nft|награду|бонус))"
      - "(?iu)\\bбез\\s*(?:комисс[иия]|газ[ау])\\s*(?:минт|mint)\\b"

      # === RU doubling scams ===
      - "(?iu)\\b(?:удвою|x2|2x)\\s+(?:крипт\\w*|биткоин|эфир|usdt|монет\\w*)\\b"
      - "(?iu)\\bпереведи\\s*(?:мне|нам)\\s*(?:\\d+(?:[\\.,]\\d+)?\\s*)?(?:btc|eth|usdt|крипт\\w*|монет\\w*)\\b(?=[^\\n]{0,40}(?:верну|назад|x2|вдвое))"

      # === RU seed/private key/mnemonic ===
      - "(?iu)\\bсид(?:\\s*фраза)?\\b|\\bсидовая\\s*фраза\\b|\\bсид-фраза\\b"
      - "(?iu)\\bмнемон[иі]ческ\\w*\\s*фраз\\w*\\b|\\bмнемоник\\b"
      - "(?iu)\\b(?:12|24)\\s+(?:слов[ао])\\s+(?:сид|мнемоник\\w*|фраз\\w*|восстановлен\\w*)\\b"
      - "(?iu)\\bприватн(?:ый|ая)\\s*ключ\\b|\\bзакрыт(?:ый|ая)\\s*ключ\\b|\\bkeystore\\b|\\bwallet\\.dat\\b|\\bсекретн\\w*\\s*фраз\\w*\\b"

      # === RU wallet connect/verify + approvals ===
      - "(?iu)\\b(?:подключи|подключить|верифицируй|верифицировать|проверь|подтверди|разблокируй|восстанови)\\s+кошел[её]к\\b"
      - "(?iu)\\bбезлимитн\\w*\\s+(?:разрешени\\w*|списани\\w*|доступ)\\b"
      - "(?iu)\\bapprove\\b(?=[^\\n]{0,20}(?:unlimited|infinite|безлимит))"
      - "(?iu)\\bsetApprovalForAll\\b|\\bpermit\\b(?=[^\\n]{0,30}(?:подписать|signature|sign|approve))"

      # === RU brand + scammy intent (поддержка в ЛС) ===
      - "(?iu)\\bmetamask\\b(?=[^\\n]{0,40}(?:восстанов|поддержк|саппорт|разблокир|help|support))"
      - "(?iu)\\b(?:trust\\s*wallet|phantom|tonkeeper|exodus|ledger|trezor)\\b(?=[^\\n]{0,40}(?:восстанов|поддержк|саппорт|help|support))"
      - "(?iu)\\bнапис(ать|ывай)\\s+(?:в\\s+лс|в\\s+личк\\w*|в\\s+директ)\\b(?=[^\\n]{0,40}(?:поддержк\\w*|саппорт|админ|модератор|официал))"

      # === RU KYC bypass ===
      - "(?iu)\\bKYC\\b(?=[^\\n]{0,20}(?:обход|байпас|обойти|обходить))"

      # === RU drainer ===
      - "(?iu)\\bдренер\\b|\\bdrainer\\b"


  # =========================
  # Profanity (нейтральная категория, пример)
  # =========================
  - id: profanity-basic
    category: profanity
    severity: low
    case_sensitive: false
    word_boundary: true
    notes: "Базовая профанация RU/EN; hate-слуры держи в отдельной категории (hate_speech)."
    terms:
      # RU (мат/брань)
      - "бля"
      - "блядь"
      - "блять"
      - "сука"
      - "сука блять"
      - "ебать"
      - "ёбать"
      - "ебаный"
      - "ёбаный"
      - "ебанутый"
      - "ёбанутый"
      - "уебок"
      - "уёбок"
      - "еблан"
      - "ебло"
