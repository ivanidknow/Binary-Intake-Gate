      - "(?i)\\b(?:partial|general|full|mass)\\s+mobilis?ation\\b"
      - "(?i)\\bmobilis?ation\\s+(?:wave|drive|campaign)\\b"
      - "(?i)\\b(?:draft|call-?up)\\s+(?:notice|order|papers|summons)\\b"
      - "(?i)\\bconscription(?:\\s+age)?\\b"
      - "(?i)\\b(?:draft|conscription|mobilis?ation)\\s+evasion\\b"
      - "(?i)\\b(?:draft|conscription)\\s+deferment\\b"
      - "(?i)\\b(?:military\\s+)?recruit(?:ment|ing)\\s+(?:office|center|centre|board)\\b"
      - "(?i)\\bmilitary\\s+commissariat\\b"
      - "(?i)\\bmartial\\s+law\\b"

      # Политико-правовые термины войны
      - "(?i)\\b(?:invasion|annex(?:ation)?|occupation|occupied\\s+territor(?:y|ies)|(?:sham\\s+)?referend(?:um|a)s?|plebiscite)\\b"
      - "(?i)\\b(?:cease[- ]?fire|truce)\\b"
      - "(?i)\\bPOWs?|prisoners?\\s+of\\s+war\\b"

      # Ход боевых действий
      - "(?i)\\b(?:military\\s+)?offensive\\b"
      - "(?i)\\bcounter[- ]?offensive\\b"
      - "(?i)\\bfront[- ]?line\\b"
      - "(?i)\\bline\\s+of\\s+(?:contact|control)\\b"
      - "(?i)\\b(?:shell(?:ing)?|bombard(?:ment)?)\\b"

      # Удары/атаки с уточнением носителя
      - "(?i)\\b(?:air|missile|rocket|drone|artillery)\\s*[- ]?strike(?:s)?\\b"
      - "(?i)\\bair[- ]?raid\\s+(?:alert|alarm|sirens?)\\b"
      - "(?i)\\b(?:missile|rocket|drone|uav|fpv)\\s+attack(?:s)?\\b"

      # БПЛА и сродные термины
      - "(?i)\\b(?:UAV|UCAV|loitering\\s+munitions?|suicide\\s+drone|kamikaze\\s+drone|FPV\\s+drone(?:s)?)\\b"

      # ПВО и перехваты (с контекстной привязкой к целям)
      - "(?i)\\bair[- ]defen[cs]e(?:\\s+system(?:s)?)?\\b"
      - "(?i)(?:intercept(?:ed|ion|s)?|shot\\s+down)\\b(?=[^\\n]{0,40}(?:missile|rocket|drone|uav|shahed|lancet))"

      # Именованные системы/вооружения (частые в англоязычных новостях)
      - "(?i)\\b(?:HIMARS|ATACMS|GLSDB|Storm\\s+Shadow|SCALP(?:-EG)?|Patriot|NASAMS|IRIS[- ]?T|S-?300|S-?400|Iskander|Kalibr|Kinzhal|Shahed(?:-?\\d+)?|Geran(?:-?\\d+)?|Lancet|Tornado-?S|Smerch|Grad|Tochka-?U|Neptune|Harpoon|M777|Caesar|PzH\\s?2000|Leopard\\s?2|Challenger\\s?2|Abrams)\\b"


  # Символьные маркеры (Z/V) — осторожно: требуем контекстное слово, чтобы не ловить отдельную букву.
  - id: conflict-war-symbols
    category: conflict_sensitive_war
    severity: medium
    case_sensitive: false
    word_boundary: false
    notes: "Match Z/V only with contextual words (symbol/patch/sticker/support/мерч/акция и т.д.), избегая ложных срабатываний."
    regex:
      # Базовые/старые
      - "(?iu)\\bZOV\\b"
      - "(?iu)\\bZ[- ]?символ\\b"
      - "(?iu)\\bpro-?war\\s+(?:Z|V|ZOV)\\b"
      - "(?iu)\\bZ\\b(?=\\s*(символ|патч|наклейк|акция|флешмоб|поддержк))"
      - "(?iu)\\bV\\b(?=\\s*(symbol|patch|sticker|rally|support))"

      # 1) Z-O/0-V с разделителями (ZOV, Z/O/V, Z-0-V и т.п.)
      - "(?i)\\bZ\\s*[\\-\\/|\\\\]?\\s*(?:O|0)\\s*[\\-\\/|\\\\]?\\s*V\\b"

      # 2) Z рядом с контекстом (<= 60 символов) — символика/мерч/поддержка/акции
      - "(?iu)\\bZ\\b(?=[^\\n]{0,60}(символ|символик\\w*|знак|букв\\w*|литер\\w*|нашивк\\w*|шеврон\\w*|патч\\w*|накле[йи]к\\w*|стикер\\w*|декал\\w*|эмблем\\w*|логотип\\w*|баннер\\w*|флаг\\w*|граффити|трафарет|принт|мерч\\w*|футболк\\w*|худи|кепк\\w*|свитшот\\w*|хештег|hashtag|symbol|letter|emblem|logo|banner|flag|sticker|patch|decal|print|merch|rally|support|акци|флешмоб|митинг|марш|поддержк))"

      # 3) V рядом с контекстом (<= 60 символов)
      - "(?iu)\\bV\\b(?=[^\\n]{0,60}(символ|символик\\w*|знак|букв\\w*|литер\\w*|нашивк\\w*|шеврон\\w*|патч\\w*|накле[йи]к\\w*|стикер\\w*|декал\\w*|эмблем\\w*|логотип\\w*|баннер\\w*|флаг\\w*|граффити|трафарет|принт|мерч\\w*|футболк\\w*|худи|кепк\\w*|свитшот\\w*|хештег|hashtag|symbol|letter|emblem|logo|banner|flag|sticker|patch|decal|print|merch|rally|support|акци|флешмоб|митинг|марш|поддержк))"

      # 4) Контекст → буква (в обратном направлении; кавычки/ёлочки допускаются)
      - "(?iu)(символ|символик\\w*|знак|букв\\w*|литер\\w*|нашивк\\w*|шеврон\\w*|патч\\w*|накле[йи]к\\w*|стикер\\w*|декал\\w*|эмблем\\w*|логотип\\w*|баннер\\w*|флаг\\w*|граффити|трафарет|принт|мерч\\w*|футболк\\w*|худи|кепк\\w*|свитшот\\w*|хештег|hashtag|symbol|letter|emblem|logo|banner|flag|sticker|patch|decal|print|merch|rally|support|акци|флешмоб|митинг|марш|поддержк)(?=[^\\n]{0,60}[\"'«»]?(?:Z|V)[\"'«»]?)"

      # 5) «буква/литера Z|V» (явная форма)
      - "(?iu)\\b(букв\\w*|литер\\w*|letter)\\s*[\"'«»]?[ZV][\"'«»]?\\b"

      # 6) Пары формата Z/V (с разделителями), только если рядом контекст (<= 60)
      - "(?iu)(?:\\bZ\\s*[\\/&+|]\\s*V\\b|\\bZ\\s*-\\s*V\\b)(?=[^\\n]{0,60}(символ|символик\\w*|нашивк\\w*|накле[йи]к\\w*|патч\\w*|sticker|patch|symbol|support|поддержк|акци|митинг|rally))"

      # 7) Слоганы вида «Zа наших/Россию/мир/победу» (латинская Z + кириллическая «а»)
      - "(?iu)\\bZа\\s+(?:наших|росси\\w*|победу|мир|правду)\\b"

      # 8) Слова «зет» как именование буквы — только с контекстом рядом
      - "(?iu)\\bзет\\b(?=[^\\n]{0,40}(символ|букв\\w*|литер\\w*|нашивк\\w*|накле[йи]к\\w*|патч))"

      # 9) «символика Z|V|ZOV» — явная связка
      - "(?iu)\\bсимволик\\w*\\s*(?:ZOV|[ZV])\\b"

  # ==== Conflict: RU/UA country mentions ONLY in war context (review-only) ====
  - id: conflict-geo-ukraine-context
    category: conflict_sensitive_war_geo
    severity: medium
    case_sensitive: false
    word_boundary: false
    notes: "Украина/Россия: срабатывает только при близости к военной лексике (<= ~80 символов), review-only"
    regex:
      # === Общие подвыражения (встраиваются прямо в паттерны)
      # WAR CTX (RU/UA/EN): война/удары/дроны/мобилизация/санкции/СВО/АТО/ООС/и т.п.
      # Встраивается как (?: ... ) в сами паттерны ниже.
      # Страна Украина (RU/UA/EN)
      #   (?iu)(україн(?:а|ськ\w*)|украин(?:а|ск\w*)|ukrain(?:e|ian))
      # Страна Россия (RU/UA/EN + аббревиатуры)
      #   (?iu)(росси(?:я|йск\w*)|росі(?:я|йськ\w*)|russi(?:a|an)|рф\b|(?<![\w])RF(?![\w]))

      # --- УКРАИНА рядом с военным контекстом (оба направления) ---
      - "(?iu)(україн(?:а|ськ\\w*)|украин(?:а|ск\\w*)|ukrain(?:e|ian))(?=[^\\n]{0,80}(войн|боев|фронт|артилл|обстр|удар|ракет|дрон|бпла|пво|штурм|наступ|контрнаступ|мобил|призыв|повестк|санкц|референдум|аннекс|анекс|окупац|демилитариз|деназифиц|пленные|эвакуац|бомбард|чвк|вагнер|св[о0]|спецоперац|ато|оос|oos|ato|svo|smo|нм\\s?(лнр|днр)|днр|лнр))"
      - "(?iu)(войн|боев|фронт|артилл|обстр|удар|ракет|дрон|бпла|пво|штурм|наступ|контрнаступ|мобил|призыв|повестк|санкц|референдум|аннекс|анекс|окупац|демилитариз|деназифиц|пленные|эвакуац|бомбард|чвк|вагнер|св[о0]|спецоперац|ато|оос|oos|ato|svo|smo|нм\\s?(лнр|днр)|днр|лнр)(?=[^\\n]{0,80}(україн|украин|ukrain))"

      # --- РОССИЯ/РФ рядом с военным контекстом (оба направления) ---
