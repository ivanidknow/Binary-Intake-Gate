  # =========================
  # Adult-explicit (бренд-сейфти; без контента о несовершеннолетних)
  # =========================
  - id: adult-explicit
    category: adult
    severity: medium
    case_sensitive: false
    word_boundary: true
    regex:
      # --- CORE порнография / обфускации ---
      - "(?i)\\b(?:porn|p\\W*[o0о]\\W*r\\W*n|pr0n|pron|porno)\\b"        # p0rn / p o r n / 'о' кириллическая
      - "(?iu)\\bпорн\\w*\\b"                                            # порно/порнуха/порево
      - "(?i)\\b(?:xxx|x{3,})\\b"
      - "(?i)\\bnsfw\\b|\\blewd\\b|\\brule\\s*34\\b"

      # --- Платформы / сайты (высокосигнальные) ---
      - "(?i)\\b(?:pornhub|xvideos|xhamster|xnxx|youporn|redtube|spankbang|youjizz|eporner|brazzers)\\b"
      - "(?i)\\b(?:only\\s*fans|onlyfans|chaturbate|cam4)\\b"

      # --- Кам/секс-чаты / ролики ---
      - "(?i)\\b(?:sex\\s*chat|cam\\s*sex|webcam\\s*sex|sex\\s*video|sex\\s*tape)\\b"
      - "(?iu)\\bсекс[-\\s]?(чат|видео|ролик\\w*)\\b"

      # --- Явные сексуальные акты (EN) ---
      - "(?i)\\b(?:blowjob|handjob|footjob|deepthroat|creampie|facial|milf|bdsm|pegging|rimming|fellatio|cunnilingus|squirting)\\b"
      # 'anal' только рядом с явным секс-контекстом, чтобы не ловить analytics/analysis
      - "(?i)\\banal\\b(?=[^\\n]{0,20}(sex|porn|creampie|dp|fuck))"
      # 'cum' — без лат. 'cum laude'
      - "(?i)\\b(?:cumshot|cumming|cumload|cumslut|bukk?ake)\\b"

      # --- Явные сексуальные акты (RU) ---
      - "(?iu)\\b(?:минет|кунилингус|куни|феллац\\w+)\\b"
      - "(?iu)\\b(?:анальн\\w+\\s+секс|оральн\\w+\\s+секс|группов\\w+\\s+секс|трах\\w*)\\b"
      - "(?iu)\\b(?:эрекц\\w+|эякуляц\\w+|сперм\\w+|конч[аи]\\w*)\\b"

      # --- Нюдсы / эротика (с ограничением для снижения шума) ---
      - "(?iu)\\bнюдс\\w*\\b|\\bньюдс\\w*\\b|\\bнудес\\w*\\b"
      - "(?iu)\\bголы(?:е|й|х)\\s+(?:фото|видео)\\b|\\bобнаж[её]н\\w+\\b"
      - "(?iu)\\bэротик\\w+\\b(?=[^\\n]{0,20}(фото|видео|контент|журнал|сайт|съёмк|съемк))"

      # --- «Слив» только при близком adult-контексте ---
      - "(?iu)\\bслив\\b(?=[^\\n]{0,30}(нюд|онлифанс|onlyfans|фото|видео|порно))"

      # --- Хентай и сопутствующее ---
      - "(?i)\\bhentai\\b|\\becchi\\b|\\bye?ao?i\\b|\\byuri\\b"
      - "(?iu)\\bхентай\\b"

      # --- Обфускации по-русски (разделители/пробелы) ---
      - "(?iu)\\bп\\W*о\\W*р\\W*н\\W*о?\\b"                                # п о р н о


  # =========================
  # Официально определённые экстремистские организации/символика
  # ЗАПОЛНЯЕШЬ САМ: термины должны быть из внутреннего или гос. реестра.
  # Здесь не должно быть общих слов о странах/идентичности.
  # =========================
  - id: extremism-official
    category: extremism_official
    severity: critical
    case_sensitive: false
    word_boundary: true
    notes: >
      Список предназначен исключительно для автоматизированной фильтрации/комплаенса.
      Поддерживай в актуальном состоянии по официальным реестрам РФ:
      — Перечень экстремистских организаций Минюста РФ; — Единый федеральный список террористических организаций (ФСБ).
      Важно: «Талибан» по решению ВС РФ от 17.04.2025 исключён из террористического списка (см. ссылки ниже) — не включать в terms для соответствия РФ.

    terms:
      # Террористические/экстремистские организации (официальные наименования / часто употребимые русские формы)
      - "Исламское государство"               # ИГ/ИГИЛ/ДАИШ
      - "ИГИЛ"
      - "ДАИШ"
      - "Аль-Каида"
      - "Джебхат ан-Нусра"                    # также: «Фронт ан-Нусра»
      - "Хайят Тахрир аш-Шам"                 # правопреемная ребрендинг-линия «ан-Нусры» (HTS)
      - "Имарат Кавказ"                       # «Кавказский эмират»
      - "Исламская партия Туркестана"
      - "Исламское движение Узбекистана"
      - "Боко Харам"
      - "Лашкар-е-Тайба"
      - "Джаиш-е-Мухаммад"
      - "Хизб ут-Тахрир аль-Ислами"
      - "Братья-мусульмане"

      # Экстремистские в РФ (примеры из перечня Минюста/судебных актов)
      - "Свидетели Иеговы"
      - "Меджлис крымскотатарского народа"
      - "Национал-большевистская партия"
      - "Русское национальное единство"
      - "Национал-социалистическое общество"
      - "Славянский союз"
      - "Правый сектор"
      - "Фонд борьбы с коррупцией"
      - "Штабы Навального"
      - "Артподготовка"

      # Полк/движение «Азов» (в РФ признан террористическим; фиксируем аккуратно)
      - "полк Азов"
      - "батальон Азов"
      - "движение Азов"

      # [историческая пометка — не добавлять в terms для комплаенса РФ]
      # - "Талибан"  # исключён из террористического списка в РФ 17.04.2025

    regex:
      # Транслитерации/латиница/аббревиатуры. Аккуратно с границами слова, дефисами, апострофами и вариантами написания.

      # ISIS / ISIL / ISIS-K / IS-K / Daesh
      - "(?i)\\bISIS(?:[-\\s]?K|\\s*Khorasan)?\\b"
      - "(?i)\\bISIL\\b"
      - "(?i)\\bDa?e?ash\\b|\\bDa'?esh\\b"                 # daesh / daish / da’esh
      # Al-Qaeda + филиалы (AQAP/AQIM/AQIS)
      - "(?i)\\bAl[-\\s]?Qa[e|i]da\\b"
      - "(?i)\\bAQAP\\b|\\bAQIM\\b|\\bAQIS\\b"
      # Jabhat al-Nusra / al-Nusra Front / HTS (Hayat Tahrir al-Sham)
      - "(?i)\\bJ(abhat|ebhat)\\s+al[-\\s]Nusra\\b|\\bAl[-\\s]?Nusra\\s+Front\\b"
      - "(?i)\\bHayat\\s+Tahrir\\s+al[-\\s]?Sham\\b|\\bHTS\\b"
      # Caucasus Emirate / Imarat Kavkaz
      - "(?i)\\bImarat\\s+Kavkaz\\b|\\bCaucasus\\s+Emirate\\b"
      # Islamic Party of Turkestan / Islamic Movement of Uzbekistan
      - "(?i)\\bIslamic\\s+Party\\s+of\\s+Turkestan\\b|\\bIPT\\b"
      - "(?i)\\bIslamic\\s+Movement\\s+of\\s+Uzbekistan\\b|\\bIMU\\b"
      # Boko Haram
      - "(?i)\\bBoko\\s+Haram\\b"
      # Lashkar-e-Taiba / Jaish-e-Mohammad
      - "(?i)\\bLashkar[-\\s]?e[-\\s]?Ta(i|y)ba\\b|\\bLeT\\b"
      - "(?i)\\bJa(i|e)sh[-\\s]?e[-\\s]?Mohammad\\b|\\bJeM\\b|\\bJaish[-\\s]?e[-\\s]?Muhamm?ad\\b"
      # Hizb ut-Tahrir (варианты)
      - "(?i)\\bHizb[\\s-]?ut[\\s-]?Tahrir\\b|\\bKhizb[\\s-]?ut[\\s-]?Tahrir\\b"
      # Muslim Brotherhood
      - "(?i)\\bMuslim\\s+Brotherhood\\b"
      # Jehovah’s Witnesses
      - "(?i)\\bJehovah'?s\\s+Witnesses\\b"
      # Mejlis of the Crimean Tatar People
      - "(?i)\\bMejlis\\s+of\\s+the\\s+Crimean\\s+Tatar\\s+People\\b"
