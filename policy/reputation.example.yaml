  - id: conflict-ua-lexicon-regex
    category: conflict_sensitive_war_ua
    severity: medium
    case_sensitive: false
    word_boundary: false
    notes: "Акронимы/корни: ловим разные словоформы"
    regex:
      # Базовые акронимы/структуры
      - "(?iu)\\bзсу\\b|\\bсбу\\b|\\bтро\\b|\\bнгу\\b|\\bдпсу\\b"
      - "(?iu)\\bміноборони\\b|\\bгш\\b|\\bгу[рr]\\b|\\bhur\\b"
      - "(?iu)\\bТЦК(?:\\s*та\\s*СП)?\\b|територіальн\\w*\\s*цент\\w*\\s*комплектуван\\w*"

      # Мобилизация/демобилизация/призыв
      - "(?iu)мобіл(ізац|ізаці)\\w*|демобіл(ізац|ізаці)\\w*|призов\\w*|повістк\\w+|військкомат\\w*"

      # Линия столкновения/фронт
      - "(?iu)лін(і|и)я\\s+зіткненн\\w*|\\bфронт(?!енд)\\w*|передов\\w*"

      # Обстріли/удары/контрнаступ/наступ/деокупація/евакуація
      - "(?iu)обстріл\\w*|ракетн\\w*\\s*(удар\\w*|обстріл\\w*)|артобстріл\\w*|артилер(і|и)\\w*"
      - "(?iu)контрнаступ\\w*|наступ\\w*|деокупац\\w*|евакуац\\w*|перегрупуванн\\w*"

      # Ракеты/ППО/ЗРК/РСЗВ/САУ/міномети
      - "(?iu)\\bППО\\b|\\bЗРК\\b|\\bРСЗВ\\b|\\bСАУ\\b|міномет\\w*|крилат\\w*\\s*ракет\\w*|балістичн\\w*\\s*ракет\\w*"

      # Дроны/БПЛА/«шахеди» — только в боевом контексте поблизости
      - "(?iu)\\bБПЛА\\b|безпілотник\\w*"
      - "(?iu)\\bдрон\\w*\\b(?=[^\\n]{0,40}(удар|атак|обстріл|нальот|наліт|скиданн|сброс|боєприпас|боєкомплект))"
      - "(?iu)\\bшахед\\w*\\b|\\bshahed\\w*\\b|\\bгерань(?:[-\\s]*\\d+)?\\b"

      # «Приліт/влучання», сирены, укрытия
      - "(?iu)прил(і|и)т\\w*|влучанн\\w*|детонац\\w*"
      - "(?iu)пов(і|и)трян\\w*\\s*тривог\\w*|в(і|и)дб(і|и)й\\s*тривог\\w*|сирен\\w*"
      - "(?iu)укритт\\w*|сховищ\\w*|бомбосховищ\\w*"

      # Оккупация/аннексия/агрессор/загарбник
      - "(?iu)окупаці\\w*|анексі\\w*|окупант\\w*|агресор\\w*|загарбник\\w*"

      # Воєнний стан / комендантський час
      - "(?iu)во(є|е)нн\\w*\\s*стан\\b|комендантськ\\w*\\s*час\\b"

      # Тероборона/Сили оборони/Повітряні сили
      - "(?iu)тероборон\\w*|сили\\s*оборони\\b|пов(і|и)трян\\w*\\s*сили\\b|морськ\\w*\\s*п(і|и)хот\\w*"

      # Системы/озброєння (review-only индикаторы)
      - "(?iu)\\bHIMARS\\b|\\bATACMS\\b|\\bGLSDB\\b|\\bPatriot\\b|\\bNASAMS\\b|\\bIRIS-?T\\b|Storm\\s*Shadow\\b|SCALP(?:-?EG)?\\b"


  # ==== Russian war lexicon (дополнение; review-only) ====
  - id: conflict-ru-lexicon-extended
    category: conflict_sensitive_war
    severity: medium
    case_sensitive: false
    word_boundary: false
    notes: "Дополняет ранее добавленные русские термины; индикатор для ручной проверки"
    regex:
      - "(?iu)\\bСВО\\b|\\bСМО\\b|\\bАТО\\b|\\bООС\\b|\\bЛБС\\b|линия\\s+(?:боев\\w+\\s+)?соприкосновени\\w*"
      - "(?iu)\\bвоенкомат\\w*\\b|\\bповестк\\w*\\b|мобилизационн\\w*\\s*пункт\\w*|пункт\\s*сбора\\s*мобилизованн\\w*"
      - "(?iu)мобилиз(аци|аці)\\w*|демобилиз(аци|аці)\\w*|\\bконтрактник\\w*\\b|контрактн\\w*\\s*служб\\w*"
      - "(?iu)обстрел\\w*|контрнаступлени\\w*|наступлени\\w*|перегруппировк\\w*|комендантск\\w*\\s*час\\b"
      - "(?iu)оккупаци\\w*|аннекс\\w*|санкци\\w*|демилитариз\\w*|денацифик\\w*"
      - "(?iu)\\bбпла\\b|беспилотник\\w*|дрон-?камикадз\\w*"
      - "(?iu)\\bдрон\\w*\\b(?=[^\\n]{0,40}(удар|атак|обстрел|нал[её]т|сбрасыв))"
      - "(?iu)ракетн\\w*\\s*(?:удар|обстрел)\\w*|крылат\\w*\\s*ракет\\w*|баллистическ\\w*\\s*ракет\\w*|\\bПВО\\b|\\bЗРК\\b"
      - "(?iu)\\bартобстрел\\w*\\b|артиллери\\w*|\\bРСЗО\\b|\\bСАУ\\b|мином[её]т\\w*|\\bГрад\\b|\\bСмерч\\b|\\bУраган\\b"
      - "(?iu)прил[её]т\\w*\\b"
      - "(?iu)\\bЧВК\\b|\\bPMC\\b|приватн\\w*\\s*военн\\w*\\s*компан\\w*"
      - "(?iu)\\bфронт(?!енд)\\w*\\b|\\bпередов[аоы]й?\\b"
      - "(?iu)укрепрайон\\w*|опорн\\w*\\s*пункт\\w*|\\bопорник\\w*"
      - "(?iu)фортификац\\w*|инженерн\\w*\\s*сооружен\\w*"
      - "(?iu)\\bшахед\\w*\\b|\\bshahed\\w*\\b|\\bгерань(?:[-\\s]*\\d+)?\\b"


  # ==== Conflict symbols Z/V — осторожный детект c контекстом ====
  - id: conflict-war-symbols-context
    category: conflict_sensitive_war
    severity: medium
    case_sensitive: false
    word_boundary: false
    notes: "Z/V отмечаются только при явном контекстном слове (символ/патч/поддержка и т.п.), чтобы не ловить одиночные буквы"
    regex:
      # ZOV (включая #, пробелы/дефисы/подчёркивания между буквами)
      - "(?iu)(?:#\\s*)?Z\\s*[-_\\s]*O\\s*[-_\\s]*V\\b"

      # Явные формы: Z/V-символ
      - "(?iu)\\bZ[- ]?символ\\b|\\bV[- ]?символ\\b"

      # Z-<контекст RU> (патч/наклейка/шеврон/нашивка/эмблема/логотип/аватар/баннер/флаг/мерч/тату/граффити/трафарет/акция/флешмоб/митинг)
      - "(?iu)\\bZ[-_ ]?(?:патч|наклейк\\w*|стикер\\w*|шеврон\\w*|нашивк\\w*|эмблем\\w*|значк\\w*|логотип\\w*|лого\\b|аватар\\w*|баннер\\w*|флаг\\w*|мерч\\w*|тату\\w*|граффит\\w*|трафарет|акци(?:я|и)|флешмоб|митинг)\\b"

      # V-<контекст EN> (patch/sticker/chevron/badge/emblem/logo/avatar/banner/flag/merch/tattoo/decal/graffiti/stencil/rally/support/campaign/action)
      - "(?iu)\\bV[-_ ]?(?:patch|sticker|chevron|badge|emblem|logo|avatar|banner|flag|merch|tattoo|decal|graffiti|stencil|rally|support|campaign|action)\\b"

      # <буква Z/V> + <контекст> (оба языка)
      - "(?iu)\\b[ZV]\\b(?=\\s*(символ|патч|наклейк\\w*|стикер\\w*|шеврон\\w*|нашивк\\w*|эмблем\\w*|значк\\w*|логотип\\w*|лого\\b|аватар\\w*|баннер\\w*|флаг\\w*|мерч\\w*|тату\\w*|граффит\\w*|трафарет|акци(?:я|и)|флешмоб|митинг|rally|support|symbol|patch|sticker|chevron|badge|emblem|logo|avatar|banner|flag|merch|tattoo|decal|graffiti|stencil|campaign|action))"

      # <контекст> + <буква Z/V> (оба языка, с кавычками/скобками)
      - "(?iu)(символ|патч|наклейк\\w*|стикер\\w*|шеврон\\w*|нашивк\\w*|эмблем\\w*|значк\\w*|логотип\\w*|лого\\b|аватар\\w*|баннер\\w*|флаг\\w*|мерч\\w*|тату\\w*|граффит\\w*|трафарет|акци(?:я|и)|флешмоб|митинг|rally|support|symbol|patch|sticker|chevron|badge|emblem|logo|avatar|banner|flag|merch|tattoo|decal|graffiti|stencil|campaign|action)\\s*[:«\"'\\(\\[]?\\s*[ZV]\\b"

      # «буква Z/V» (частый оборот)
      - "(?iu)\\bбукв[аы]\\s*[«\"']?[ZV][»\"']?\\b"

      # Транслитерация «зет/zet/zed» только при наличии контекстных слов
      - "(?iu)\\b(зет|zet|zed)\\b(?=\\s*(символ|патч|наклейк\\w*|шеврон\\w*|нашивк\\w*|эмблем\\w*|значк\\w*|логотип\\w*|аватар\\w*|флаг\\w*|мерч\\w*|поддержк\\w*|rally|support|symbol|patch|sticker|flag))"

      # pro-war / pro-Z (англ. формулировки поддержки)
      - "(?iu)\\bpro-?war\\s+Z\\b|\\bpro-?Z\\b|\\bpro\\s*\\-?\\s*Z\\b"
